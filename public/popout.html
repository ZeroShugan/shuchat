<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ShuChat — Stream</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #0e0e12; color: #e6e8ee; font-family: system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: #000; }
  footer { display: flex; align-items: center; gap: 14px; padding: 8px 12px; background: #17181c;
           border-top: 1px solid #2b2d33; }
  #title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
           font-size: .8rem; opacity: .8; }
  label { display: flex; align-items: center; gap: 6px; font-size: .8rem; cursor: pointer; }
  button { border: 1px solid #3a3d44; border-radius: 7px; background: #2b2d31; color: #e6e8ee;
           font-size: .8rem; padding: 6px 12px; cursor: pointer; font-family: inherit; }
  button:hover { background: #3a3d44; }
</style>
</head>
<body>
  <video id="v" autoplay muted playsinline></video>
  <footer>
    <span id="title">Stream</span>
    <label><input type="checkbox" id="top" checked /> Stay on top</label>
    <button id="back">Return to main window</button>
  </footer>
<script>
  // The opener (same origin, same process) calls this with the live stream.
  window.__shuSetStream = function (stream, title) {
    var v = document.getElementById('v');
    v.srcObject = stream;
    v.play().catch(function () {});
    if (title) {
      document.getElementById('title').textContent = title;
      document.title = 'ShuChat — ' + title;
    }
    // Close automatically when the stream ends (e.g. sharer stopped).
    var end = function () { window.close(); };
    stream.getTracks().forEach(function (t) { t.addEventListener('ended', end); });
    stream.addEventListener('inactive', end);
  };

  var desktop = window.shuchatDesktop || {};
  document.getElementById('top').addEventListener('change', function (e) {
    if (desktop.popoutSetAlwaysOnTop) desktop.popoutSetAlwaysOnTop(!!e.target.checked);
  });
  document.getElementById('back').addEventListener('click', function () {
    if (desktop.popoutFocusMain) desktop.popoutFocusMain();
    window.close();
  });
</script>
</body>
</html>
